server:
  port: ${PORT:9000}

spring:
  application:
    name: bc-hybridchatbot-gateway
  cloud:
#    nacos:
#      discovery:
#        server-addr: ${NACOS_SERVER:localhost:8848}  # Variable de entorno
#        username: nacos
#        password: nacos
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
#      discovery:
#        locator:
#          enabled: true
#          lower-case-service-id: true
      routes:
        - id: bc-hybridchatbot
          uri: ${BACKEND_SERVICE}
          predicates:
            - Path=/api-hybridchatbot/**
        - id: bc-hybridchatbot-stats
          uri: ${BACKEND_STATS_SERVICE}
          predicates:
            - Path=/api-hybridchatbot-stats/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
  health:
    show-details: never

