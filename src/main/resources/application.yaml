server:
  port: 9000

spring:
  application:
    name: bc-hybridchatbot-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: bc-hybridchatbot
          uri: lb://bc-hybridchatbot
          predicates:
            - Path=/api-hybridchatbot/**
        - id: bc-hybridchatbot-stats
          uri: lb://bc-hybridchatbot-stats
          predicates:
            - Path=/api-hybridchatbot-stats/**


management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
  health:
    show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    com.alibaba.cloud.nacos: DEBUG